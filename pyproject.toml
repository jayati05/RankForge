[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["rank-bm25==0.2.2", "numpy==2.2.6"]

[project.optional-dependencies]
tracking = ["mlflow-skinny==3.5.1"]
api = ["fastapi==0.121.0", "starlette==0.49.3", "pydantic==2.12.3", "uvicorn==0.38.0", "httpx==0.28.1", "anyio==4.11.0"]
analysis = ["matplotlib==3.10.7"]
neural = ["sentence-transformers==5.1.2", "transformers==4.57.1", "huggingface-hub==0.36.0", "torch==2.9.0", "truststore==0.10.4"]
dev = ["pytest==8.4.2", "ruff==0.14.2", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
